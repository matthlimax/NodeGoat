on: 
  push: 
    branches: [feature-ejs]

jobs:
  veracode-auto-package:
    name: Veracode Auto Package
    runs-on: ubuntu-latest
    steps: 
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Veracode CLI Download and Package
        env: 
          VERACODE_API_KEY_ID: ${{ secrets.VERACODE_ID }}
          VERACODE_API_KEY_SECRET: ${{ secrets.VERACODE_KEY }}
        run: |
          curl -fsS https://tools.veracode.com/veracode-cli/install | sh
          ./veracode package --source . --output verascan --trust
          ls -l




      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: veracode_pack
          path: verascan

  Veracode-SAST-Pipeline:
    name: Veracode SAST Pipeline
    runs-on: ubuntu-latest
    needs: [veracode-auto-package]

    steps:
      - name: Download artfacts
        uses: actions/download-artifact@v4
        with:
          name: veracode_pack
          path: verascan
      
      - name: Pipeline Scan with wrapper
        run: |
          curl -O -L https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip -u pipeline-scan-LATEST.zip
          java -jar pipeline-scan.jar -vid "${{ secrets.VID }}" -vkey "${{ secrets.VKEY }}" --file verascan/veracode-auto-pack-NodeGoat-js.zip --baseline_file baselineResults.json
        continue-on-error: false


        
  Veracode_Software_Composition_Analisys:
    runs-on: ubuntu-latest
    name: Veracode SCA Scan
    needs: [veracode-auto-package]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run SCA Scan
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SRCCLR_API_TOKEN }}
        run: |
          curl -sSL https://download.sourceclear.com/ci.sh | bash -s scan --update-advisor --uri-as-name

  Veracode-SAST-Policy-Scan:
     name: Veracode Policy Scan
     runs-on: ubuntu-latest
     needs: [veracode-auto-package]

     steps:
       - name: Download artfacts
         uses: actions/download-artifact@v4
         with:
           name: veracode_pack
           path: verascan

       - name: Upload and Scan - Action
         uses: veracode/veracode-uploadandscan-action@0.2.7
         with:
           appname: autopackage_js
           filepath: verascan/veracode-auto-pack-NodeGoat-js.zip
           vid: "${{ secrets.VID }}"
           vkey: "${{ secrets.VKEY }}"
           createProfile: true
           deleteincompletescan: 2

  Veracode-SAST-SandBoxScan:
     name: Veracode SandBox Scan
     runs-on: ubuntu-latest
     needs: [veracode-auto-package]

     steps:
       - name: Download artfacts
         uses: actions/download-artifact@v4
         with:
           name: veracode_pack
           path: verascan

       - name: Upload and Scan - Action
         uses: veracode/veracode-uploadandscan-action@0.2.7
         with:
           appname: autopackage_js
           filepath: verascan/veracode-auto-pack-NodeGoat-js.zip
           sandboxName: funcionalidade nova 
           createSandBox: true
           vid: "${{ secrets.VID }}"
           vkey: "${{ secrets.VKEY }}"
           createProfile: true
           deleteincompletescan: 2


  Veracode-Baseline:
    name: Veracode_Baseline_PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empacotamento dos arquivos
        uses: thedoctor0/zip-release@master
        with:
          filename: 'veracode.zip'
          path: .
      - name: Publicando Artefato
        uses: actions/upload-artifact@v4
        with:
          name: pacoteVeracode
          path: |
            baselineResults.json
            veracode.zip
  
  Veracode_SCA:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Veracode SCA
        env:
          SRCCLR_API_TOKEN: ${{ secrets.SCA }} # Lembrar de criar as credenciais no Secrets
        run: |
          curl -sSL 'https://download.sourceclear.com/ci.sh' | bash -s – scan --update-advisor --allow-dirty

  Veracode_PipelineScan:
    runs-on: ubuntu-latest
    steps:
      - name: Download Artefato
        uses: actions/download-artifact@v4
        with:
          name: pacoteVeracode
      - name: Download Pipeline Scan
        run: |
          curl -sSO https://downloads.veracode.com/securityscan/pipeline-scan-LATEST.zip
          unzip pipeline-scan-LATEST.zip
      - name: Veracode Pipeline Scan
        env:
          VID: ${{ secrets.VeracodeID }} # Lembrar de criar as credenciais no Secrets
          VKEY: ${{ secrets.VeracodeKey }}
          CaminhoArquivo: './veracode.zip'
        run: |
          java -jar pipeline-scan.jar -vid $VID -vkey $VKEY -f $CaminhoArquivo --issue_details true --baseline_file baselineResults.json
